openapi: 3.1.0
info:
  title: Project I.R.I.S. API
  description: |
    Backend API Specification for I.R.I.S. (Ingenious Rusty Intelligent System).
    Communication interface with the autonomous AI partner built with Rust running on Raspberry Pi 5.
  version: 0.1.0
  contact:
    name: I.R.I.S. Development Team

servers:
  - url: http://localhost:3000
    description: Local Development Environment (Docker)
  - url: http://raspberrypi.local:3000
    description: Raspberry Pi 5 Production Environment

paths:
  /health:
    get:
      summary: Health Check
      description: Check the server's operational status. Used for liveness monitoring.
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: Server is running normally
          content:
            text/plain:
              schema:
                type: string
                example: "I.R.I.S. is feeling perfectly fine... mostly."

  /api/chat:
    post:
      summary: Chat Endpoint
      description: |
        Receives text messages from the user and returns I.R.I.S.'s response.
        Internally passes through the Sense -> Memory -> Logic -> Action pipeline.
      operationId: chat
      tags:
        - Interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: "Please tell me the weather today"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                reply: "My circuits are a bit rusty... but it's forecast to be sunny today!"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Message text from the user
          minLength: 1
          maxLength: 2000
          example: "Please tell me the weather today"

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          description: Response text from I.R.I.S.
          example: "My circuits are a bit rusty... but it's forecast to be sunny today!"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: error type
        message:
          type: string
          description: Detailed error message (English)

  tags:
    - name: System
      description: Endpoints for server status check and management
    - name: Interaction
      description: Interaction interface with I.R.I.S.
