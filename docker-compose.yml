services:
  # -----------------------------------------------
  # I.R.I.S. アプリケーション本体（ベース共通設定）
  # -----------------------------------------------
  iris-core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: iris_core
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - SURREAL_URL=ws://surrealdb:8000
      - OLLAMA_URL=http://ollama:11434
      - MEMORIES_PATH=/var/iris/memories
    depends_on:
      surrealdb:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - iris_net

  # -----------------------------------------------
  # SurrealDB（グラフ記憶エンジン・メタデータ管理）
  # -----------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: iris_surrealdb
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/mydata
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - iris_net

  # -----------------------------------------------
  # Ollama（ローカルLLM: Gemma 3n）
  # -----------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: iris_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - iris_net

# -----------------------------------------------
# 永続化ボリューム（共通）
# -----------------------------------------------
volumes:
  surrealdb_data:
  ollama_data:
  # エピソード記憶 CMS（日時ベースのMarkdownファイル群）
  memories_data:

# -----------------------------------------------
# ネットワーク（共通）
# -----------------------------------------------
networks:
  iris_net:
    driver: bridge
