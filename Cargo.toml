[package]
name = "iris"
version = "0.1.0"
edition = "2024"

[dependencies]
# 非同期ランタイム
tokio = { version = "1", features = ["full"] }

# Web サーバー
axum = "0.8"

# HTTP クライアント（Ollama / Tavily API 通信）
reqwest = { version = "0.12", features = ["json"] }

# シリアライズ / デシリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SurrealDB（リモート WebSocket 接続のみ。DBはDockerコンテナとして起動する）
surrealdb = { version = "2" }

# 時刻処理（記憶タイムスタンプ・忘却曲線計算）
chrono = { version = "0.4", features = ["serde"] }
